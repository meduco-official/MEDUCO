<!DOCTYPE html>
<html>

<head>
<title>MEDUCO Create Account</title>

<style>

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#050505;
font-family:Poppins,sans-serif;
}

.box{

width:350px;
padding:40px;
background:#111;
border-radius:20px;
text-align:center;
color:white;

}

h1{
color:#d4af37;
}

input{

width:90%;
padding:15px;
margin:10px;
background:#222;
border:none;
color:white;
border-radius:10px;

}


button{

width:95%;
padding:15px;
border:none;
border-radius:30px;
background:#d4af37;
font-weight:bold;

}

</style>

</head>


<body>


<div class="box">

<h1>MEDUCO</h1>

<h2>Create Account</h2>


<input placeholder="Full Name">

<input placeholder="Email">


<input type="password" placeholder="Password">


<button onclick="createAccount()">
CREATE ACCOUNT
</button>


</div>



<script>

function createAccount(){

alert("Account created successfully!");

window.location.href="login.html";

}

</script>


</body>

</html>
